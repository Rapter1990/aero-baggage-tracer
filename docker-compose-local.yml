# Local development infrastructure only (matches the `dev` profile endpoints in config-server:
# localhost:9092, localhost:6379, localhost:5433). Run services from the IDE or Maven. The
# notification-service (port 1118) needs only Kafka (recovery.case.changed.v1, baggage.dead-letter.v1)
# and Postgres (its own schema, created on start).
#   docker compose -f docker-compose-local.yml up -d
# The journey-service runs outside Compose here, so JOURNEY_LIQUIBASE_CONTEXTS (default
# expand,contract; add dev for 20 sample bags) is set in its own environment, not in .env.
# Dev-only credentials; override via env vars. Never reuse them outside local development.
# One project name for both compose files and every checkout or worktree (it is the name the main
# checkout already uses, so existing volumes keep working): the containers have fixed names and the
# network is shared, so a second project name would collide with the first.
name: aero-baggage-tracer
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for the host (localhost:9092), INTERNAL is for containers such as kafka-ui.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - aerotrace

  # One-shot job: creates the topics with their partition counts and retention before the services
  # you run from the IDE use them (the broker would otherwise auto-create them with 1 partition).
  # Same topics and settings as docker-compose.yml. Idempotent (--if-not-exists), so it is safe on
  # every `up`. It does not change a topic that already exists, e.g. one auto-created earlier:
  # delete that topic once (Kafka UI) to get the new settings. It reaches the broker on the
  # INTERNAL listener (kafka:19092), because the one on 9092 is advertised as localhost.
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.scan.received.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.risk.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=compact,delete --config retention.ms=7776000000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.scan.anomaly.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic recovery.case.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic recovery.capacity.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.dead-letter.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000
        # baggage.risk.changed.v1 is replayed from offset 0 by the search rebuild (ADR 0004): compact keeps the
        # latest event per bagTag:legId. kafka-configs also fixes a topic that already existed with `delete` only.
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server $$B --alter --entity-type topics --entity-name baggage.risk.changed.v1 --add-config cleanup.policy=[compact,delete],retention.ms=7776000000
        # Published by the journey-service (#28), read by the search-service (#15 owns its final settings).
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.bag.registered.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aerotrace

  # The search-service's read models. Same image and security as docker-compose.yml (Elastic
  # publishes no latest tag: this is its newest release, 9.5.6). ELASTIC_PASSWORD has a dev-only
  # default here. Port 9200 is published, for the search-service run from the IDE
  # (http://localhost:9200, user elastic).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      # DEV ONLY default, so `docker compose -f docker-compose-local.yml up` works without a .env
      # for developers who do not use search. Never use it anywhere else: set ELASTIC_PASSWORD.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-dev-only-elastic-password}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - aerotrace

  # Web UI for Kafka: topics, messages, consumer groups. The outbox events of the journey-service
  # (topic baggage.scan.received.v1) show up here. Open http://localhost:8090.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # The listener for containers (the one on 9092 is advertised as localhost for the host).
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aerotrace

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      POSTGRES_DB: ${POSTGRES_DB:-aerotrace}
    ports:
      - "5433:5432"
    volumes:
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - aerotrace

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - aerotrace

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - aerotrace

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    # Anyone who can reach it could push fake numbers: keep it on a trusted network (the script runs on the host).
    ports:
      - "9091:9091"
    networks:
      - aerotrace

  # The test inbox for the alert emails (http://localhost:8025). It accepts SMTP from the Compose
  # network only and forwards nothing. The UI has no login, so it is published on loopback only.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - aerotrace

  # Receives the alerts of Prometheus. Its UI and API have no login and can silence alerts, so the
  # port is published on the loopback interface only.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    # The external URL makes the links in the alert emails open from this machine.
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--web.external-url=http://localhost:9093"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - mailpit
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    # The first two arguments are the image's own defaults; the external URL is what the "source" links
    # of alerts (in Alertmanager and its emails) start with.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.external-url=http://localhost:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - otel-collector
    networks:
      - aerotrace

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - aerotrace

volumes:
  # postgres-18-data: PostgreSQL 18 needs its own volume. The old postgres-data volume was made by an
  # older, Alpine-based or version 17 image (data owned by uid 70, layout of 17), so the current
  # image cannot start on it and the container exits. It is left untouched; remove it with
  # `docker volume rm aero-baggage-tracer_postgres-data` once you no longer need its contents.
  postgres-18-data:
  tempo-data:
  loki-data:
  elasticsearch-data:

networks:
  aerotrace:
    name: aerotrace
