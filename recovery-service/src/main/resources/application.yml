server:
  port: 1115

spring:
  application:
    name: recovery-service
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aerotrace}
    username: ${DB_USER:aerotrace}
    # No default: the service refuses to start rather than guess a database password.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Liquibase does not create the schema that holds its own tracking tables.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS recovery
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: recovery
    liquibase-schema: recovery
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # No default: set REDIS_PASSWORD (Compose does). Redis runs with requirepass; without the
      # right password it refuses the connection, the policy cache is unavailable and the policy
      # is read from the database (see docs/adr/0001-redis-policy-cache.md).
      password: ${REDIS_PASSWORD}
      # Short, so an unreachable Redis costs a request a fraction of a second, then the database
      # answers instead (see docs/adr/0001-redis-policy-cache.md).
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    admin:
      # With observation on, every traced send asks the cluster id through an admin client. With an
      # unreachable broker that call waits for the admin client's 60 s API default, while the outbox
      # relay holds its transaction and lock. These limits keep a send close to the producer's own
      # timeouts, so an outage costs the relay seconds, not minutes (found by KafkaOutageTest).
      close-timeout: 2s
      operation-timeout: 2s
      properties:
        default.api.timeout.ms: 3000
        request.timeout.ms: 2000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:recovery-service}
      # A new group reads the topic from the start, so no risk event is missed on first start.
      auto-offset-reset: earliest
      # Offsets are committed by the listener container after a record was handled (or dead-lettered).
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 300000
    producer:
      # The outbox relay retries, so the producer must not reorder or duplicate on its own retries.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000

aerotrace:
  recovery:
    outbox:
      # How often the relay looks for unpublished events, and how many it takes at a time.
      relay-delay: ${RECOVERY_OUTBOX_RELAY_DELAY:200ms}
      batch-size: ${RECOVERY_OUTBOX_BATCH_SIZE:200}
      # Published rows older than this are removed.
      retention: ${RECOVERY_OUTBOX_RETENTION:7d}
    policy:
      # How long Redis may serve a cached recovery policy. A change by an admin evicts it at once;
      # this is the longest a change can go unseen if Redis cannot be reached to evict it.
      cache-ttl: ${RECOVERY_POLICY_CACHE_TTL:5m}
    consumers:
      enabled: ${RECOVERY_CONSUMERS_ENABLED:true}
      # Transient failures are retried this many times (doubling wait) before the event is dead-lettered.
      retry-attempts: ${RECOVERY_CONSUMER_RETRY_ATTEMPTS:3}
      retry-backoff: ${RECOVERY_CONSUMER_RETRY_BACKOFF:200ms}
      # Processed event ids are forgotten after this; keep it longer than the topics' retention (7d).
      dedupe-retention: ${RECOVERY_DEDUPE_RETENTION:14d}
    capacity:
      # Where the capacity-service answers (the Compose / Kubernetes service name).
      base-url: ${CAPACITY_SERVICE_URL:http://localhost:1116}
      # A slower capacity-service counts as unavailable: the move is refused with 503, nothing stays held.
      connect-timeout: ${CAPACITY_CONNECT_TIMEOUT:2s}
      read-timeout: ${CAPACITY_READ_TIMEOUT:5s}
      # A case that stays RESERVED longer than this is cancelled and its hold released.
      hold-timeout: ${CAPACITY_HOLD_TIMEOUT:15m}
      sweep-delay: ${CAPACITY_SWEEP_DELAY:30s}
      # Shared secret the capacity-service accepts from a service caller. Sent only on calls without
      # a user token (the sweeper's releases). No default: empty sends none.
      service-token: ${CAPACITY_SERVICE_TOKEN:}
    docs:
      enabled: ${DOCS_ENABLED:true}
    jwt:
      audience: ${IDENTITY_AUDIENCE:aerotrace-api}
      # The identity-service public key (PEM), inline or from a location. With nothing set, the
      # development key bundled in src/main/resources/keys is used.
      public-key: ${IDENTITY_JWT_PUBLIC_KEY:}
      public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis is an optimization here: the service works without it, so a Redis outage must not
      # make the pod unready and take the service out of rotation.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.kafka.template: true
  observations:
    enable:
      # The relay runs every 200 ms; idle runs must not fill the traces.
      tasks:
        scheduled:
          execution: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}

springdoc:
  api-docs:
    enabled: ${aerotrace.recovery.docs.enabled}
