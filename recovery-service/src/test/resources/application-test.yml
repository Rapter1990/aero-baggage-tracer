# Defaults for every Spring test.
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 0
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  kafka:
    producer:
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 3000
        request.timeout.ms: 1000
eureka:
  client:
    enabled: false
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
aerotrace:
  recovery:
    outbox:
      # Tests drive the relay by hand; the scheduler only fires once an hour.
      relay-delay: 1h
    capacity:
      # A slow capacity-service is cut off quickly; the sweeper only fires when a test calls it.
      read-timeout: 500ms
      connect-timeout: 1s
      sweep-delay: 1h
    jwt:
      public-key-location: classpath:keys/public.pem
