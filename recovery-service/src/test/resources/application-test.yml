# Defaults for every Spring test.
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 0
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  kafka:
    producer:
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 3000
        request.timeout.ms: 1000
  data:
    redis:
      # The tests start Redis themselves and set host, port and password; these only keep a test
      # that has no Redis (or a dead one on purpose) fast and well-formed.
      password: test
      timeout: 300ms
      connect-timeout: 300ms
eureka:
  client:
    enabled: false
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
aerotrace:
  recovery:
    outbox:
      # Tests drive the relay by hand; the scheduler only fires once an hour.
      relay-delay: 1h
    policy:
      # Short enough to watch an entry expire in a test.
      cache-ttl: 4s
    consumers:
      # Only the Kafka test starts the listeners; the others call the handler directly.
      enabled: false
      retry-backoff: 50ms
    capacity:
      # A slow capacity-service is cut off quickly; the sweeper only fires when a test calls it.
      read-timeout: 500ms
      connect-timeout: 1s
      sweep-delay: 1h
      service-token: test-service-token
    jwt:
      public-key-location: classpath:keys/public.pem
