server:
  port: 8761

spring:
  application:
    name: discovery-server
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  security:
    user:
      # Credentials every Eureka client and dashboard user must present (HTTP Basic). No default
      # password: the server refuses to start without one rather than run open.
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Standalone dev profile: the server does not register with or fetch from itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Keep entries during short outages in dev; self-preservation is off so dead
    # instances disappear quickly while developing.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Traces and metrics go to the OpenTelemetry collector (Tempo and Prometheus read from it).
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}
