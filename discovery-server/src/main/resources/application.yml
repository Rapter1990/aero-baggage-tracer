server:
  port: 8761

spring:
  application:
    name: discovery-server
  security:
    user:
      # Credentials every Eureka client and dashboard user must present (HTTP Basic). No default
      # password: the server refuses to start without one rather than run open.
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Standalone dev profile: the server does not register with or fetch from itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Keep entries during short outages in dev; self-preservation is off so dead
    # instances disappear quickly while developing.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
