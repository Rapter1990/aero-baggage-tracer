# Shared by every service and every profile. No secrets here: use env vars / K8s Secrets.
aerotrace:
  risk:
    # Airport-specific risk threshold in minutes; override per airport or service as needed.
    threshold-minutes: 20
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # Every service sends traces and metrics to the OpenTelemetry collector (Tempo, Prometheus).
        # The client resolves these placeholders from its own environment.
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}
eureka:
  instance:
    # Every service registers as <application>:<hostname>:<port>, e.g. journey-service:localhost:8082.
    # The client fills in the placeholders; set EUREKA_INSTANCE_HOSTNAME per environment.
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}
