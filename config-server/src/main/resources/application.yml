server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # include (not active) so an extra SPRING_PROFILES_ACTIVE value cannot switch off the native backend.
    include: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
