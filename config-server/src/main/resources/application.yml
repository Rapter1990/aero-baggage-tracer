server:
  port: 1111

spring:
  application:
    name: config-server
  config:
    # Optional local settings (see .env.example); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    # include (not active) so an extra SPRING_PROFILES_ACTIVE value cannot switch off the native backend.
    include: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # Same <application>:<hostname>:<port> format as every other service (not the machine name).
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
