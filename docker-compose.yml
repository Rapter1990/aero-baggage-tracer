# Standard stack: runs prebuilt images (published by CI later) instead of building from source.
#   docker compose up -d
# Use docker-compose-local.yml to build from the working tree.
services:
  discovery-server:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-discovery-server:${TAG:-latest}
    container_name: discovery-server
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - aerotrace

  config-server:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-config-server:${TAG:-latest}
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - aerotrace

networks:
  aerotrace:
    name: aerotrace
