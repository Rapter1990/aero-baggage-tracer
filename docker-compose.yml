# Standard stack: runs prebuilt images (published by CI later) plus the shared infrastructure.
#   docker compose up -d
# Inside the network services use the `compose` profile endpoints (kafka:9092, redis:6379,
# postgres:5432). Redis and Postgres are internal only; Kafka is reachable from the host on
# localhost:29092.
# Use docker-compose-local.yml for dev-only infrastructure (Kafka, Redis, Postgres on localhost).
# Dev-only credentials; override via env vars. Never reuse them outside local development.
# One project name for both compose files and every checkout or worktree (it is the name the main
# checkout already uses, so existing volumes keep working): the containers have fixed names and the
# network is shared, so a second project name would collide with the first.
name: aero-baggage-tracer
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - aerotrace

  # One-shot job: creates the topics with their partition counts and retention before any service
  # uses them (the broker would otherwise auto-create them with 1 partition and its defaults).
  # Idempotent (--if-not-exists), so it is safe on every `up`. It does not change a topic that
  # already exists, e.g. one auto-created earlier: delete that topic once to get the new settings.
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.scan.received.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.risk.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=compact,delete --config retention.ms=7776000000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.scan.anomaly.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic recovery.case.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic recovery.capacity.changed.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.dead-letter.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000
        # baggage.risk.changed.v1 is replayed from offset 0 by the search rebuild (ADR 0004): compact keeps the
        # latest event per bagTag:legId. kafka-configs also fixes a topic that already existed with `delete` only.
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server $$B --alter --entity-type topics --entity-name baggage.risk.changed.v1 --add-config cleanup.policy=[compact,delete],retention.ms=7776000000
        # Published by the journey-service (#28), read by the search-service (#15 owns its final settings).
        $$T --bootstrap-server $$B --create --if-not-exists --topic baggage.bag.registered.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aerotrace

  # The search read models (search-service only). Single node, security on. Elastic publishes no
  # latest tag (https://www.docker.elastic.co/r/elasticsearch), so this is its newest release, 9.5.6.
  # ELASTIC_PASSWORD has a dev-only default (set your own). Port 9200 is published
  # (http://localhost:9200, user elastic). TLS is off.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-dev-only-elastic-password}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - aerotrace

  # Prometheus metrics of Elasticsearch (cluster health, heap, indexes, search and indexing rates)
  # for the "AeroTrace - Elasticsearch" Grafana dashboard. Prometheus scrapes it on 9114; the port
  # is not published. It logs in with the same elastic user (ES_USERNAME/ES_PASSWORD, not in a URL).
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch-exporter
    restart: unless-stopped
    command:
      - --es.uri=http://elasticsearch:9200
      - --es.all
      - --es.indices
    environment:
      ES_USERNAME: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD:-dev-only-elastic-password}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - aerotrace

  # Web UI for Kafka: topics, messages, consumer groups. The outbox events of the journey-service
  # (topic baggage.scan.received.v1) show up here. Open http://localhost:8090.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aerotrace

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      POSTGRES_DB: ${POSTGRES_DB:-aerotrace}
    volumes:
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  discovery-server:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-discovery-server:${TAG:-latest}
    container_name: discovery-server
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: discovery-server
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-eureka}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - aerotrace

  config-server:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-config-server:${TAG:-latest}
    container_name: config-server
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config-server
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "1111:1111"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1111/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - aerotrace

  identity-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-identity-service:${TAG:-latest}
    container_name: identity-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: identity-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aerotrace}
      DB_USER: ${POSTGRES_USER:-aerotrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      # "dev" also creates the dummy accounts (dummy.agent, ...; password dummy-password-1). Set
      # LIQUIBASE_CONTEXTS=schema in .env to start without them.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-dev}
      # The RSA key pair (PEM) that signs the tokens. Empty: the development pair bundled in
      # the image is used, whose private key is in the repository. Use your own for
      # anything that matters, e.g. IDENTITY_JWT_PRIVATE_KEY_LOCATION=file:/run/secrets/jwt.pem
      # with a bind mount or a secret.
      IDENTITY_JWT_PRIVATE_KEY_LOCATION: ${IDENTITY_JWT_PRIVATE_KEY_LOCATION:-}
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Clients normally reach it through the gateway (/api/v1/auth/**); 1112 is its own port.
    ports:
      - "1112:1112"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1112/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  journey-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-journey-service:${TAG:-latest}
    container_name: journey-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: journey-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aerotrace}
      DB_USER: ${POSTGRES_USER:-aerotrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Liquibase contexts (ADR 0007): expand = additive steps, contract = the steps that make a
      # change mandatory, dev = 20 sample bags (9000000001-9000000020, no events published). The
      # default has no sample data; set JOURNEY_LIQUIBASE_CONTEXTS=expand,contract,dev in .env to
      # add them. "expand" alone holds back the NOT NULL step for a staged rollout.
      JOURNEY_LIQUIBASE_CONTEXTS: ${JOURNEY_LIQUIBASE_CONTEXTS:-expand,contract}
      # Read by the search-service rebuild on the internal bag/case export (never through the gateway).
      SEARCH_EXPORT_SERVICE_TOKEN: ${SEARCH_EXPORT_SERVICE_TOKEN:-aerotrace-local-export-token}
      # Empty: the identity-service development public key bundled in the image is used.
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Clients reach it through the gateway (/api/v1/bags/**, /api/v1/scans/**); 1113 is its own port.
    ports:
      - "1113:1113"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1113/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  # Recovery cases, the capacity saga, the recovery policy and the consumers of the risk, anomaly and
  # capacity events. Redis only caches the policy: the service runs (slower on one read) without it.
  recovery-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-recovery-service:${TAG:-latest}
    container_name: recovery-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: recovery-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aerotrace}
      DB_USER: ${POSTGRES_USER:-aerotrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      # The capacity-service; while it is down, moving a case to RESERVED answers 503.
      CAPACITY_SERVICE_URL: ${CAPACITY_SERVICE_URL:-http://capacity-service:1116}
      # Shared with the capacity-service: the sweeper releases holds with no user token. The default
      # is for local runs only; set CAPACITY_SERVICE_TOKEN in .env for anything shared.
      CAPACITY_SERVICE_TOKEN: ${CAPACITY_SERVICE_TOKEN:-aerotrace-local-service-token}
      # Read by the search-service rebuild on the internal bag/case export (never through the gateway).
      SEARCH_EXPORT_SERVICE_TOKEN: ${SEARCH_EXPORT_SERVICE_TOKEN:-aerotrace-local-export-token}
      # Empty: the identity-service development public key bundled in the image is used.
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Clients reach it through the gateway (/api/v1/recovery-cases/**, /api/v1/recovery-policy);
    # 1115 is its own port.
    ports:
      - "1115:1115"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1115/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  # Finite recovery capacity with atomic reservations (PostgreSQL decides; Redis is not used).
  # Publishes recovery.capacity.changed.v1 through its outbox.
  capacity-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-capacity-service:${TAG:-latest}
    container_name: capacity-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: capacity-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aerotrace}
      DB_USER: ${POSTGRES_USER:-aerotrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CAPACITY_SERVICE_TOKEN: ${CAPACITY_SERVICE_TOKEN:-aerotrace-local-service-token}
      # Empty: the identity-service development public key bundled in the image is used.
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Clients reach it through the gateway (/api/v1/capacity/**); 1116 is its own port.
    ports:
      - "1116:1116"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1116/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  # Bag search and the airport report from the Elasticsearch read models, fed by the case, scan,
  # risk and bag events. Derived data: rebuilt from the owning services (POST /api/v1/admin/search/
  # reindex), never written to them.
  search-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-search-service:${TAG:-latest}
    container_name: search-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: search-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      # The service needs a named user outside the dev profiles. This development stack uses the
      # elastic superuser; give it a least-privilege user anywhere else (docs/apis/SEARCH-API.md).
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-dev-only-elastic-password}
      # HMAC key of the paging cursors, the same for every instance, at least 32 bytes. The default
      # is for this development stack only: set your own SEARCH_CURSOR_SECRET anywhere else.
      SEARCH_CURSOR_SECRET: ${SEARCH_CURSOR_SECRET:-dev-only-search-cursor-secret-0123456789abcdef}
      # The internal export endpoints of the owners (#28, #29) and the token they accept. The same
      # value goes to the journey-, recovery- and search-service; the default is for local runs only
      # (set SEARCH_EXPORT_SERVICE_TOKEN in .env for anything shared).
      JOURNEY_SERVICE_URL: ${JOURNEY_SERVICE_URL:-http://journey-service:1113}
      RECOVERY_SERVICE_URL: ${RECOVERY_SERVICE_URL:-http://recovery-service:1115}
      SEARCH_EXPORT_SERVICE_TOKEN: ${SEARCH_EXPORT_SERVICE_TOKEN:-aerotrace-local-export-token}
      # The identity-service public key. The service refuses to start without one; this
      # development stack names, explicitly, the development key bundled in the image (the pair
      # identity-service signs with here). Set your own key pair wherever tokens matter.
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-classpath:keys/public.pem}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Clients reach it through the gateway (/api/v1/search/**, /api/v1/reports/**,
    # /api/v1/admin/search/**), which finds it over the Compose network. 1117 is its own port.
    ports:
      - "1117:1117"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1117/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  # In-app notifications for the assigned handler of a recovery case, from recovery.case.changed.v1
  # (BR-08, ADR 0005). Reads its own schema in Postgres; dead letters go to baggage.dead-letter.v1.
  # No Redis and no calls to other services.
  notification-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-notification-service:${TAG:-latest}
    container_name: notification-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aerotrace}
      DB_USER: ${POSTGRES_USER:-aerotrace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aerotrace}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # The identity-service public key. The service refuses to start without one; this
      # development stack names, explicitly, the development key bundled in the image (the pair
      # identity-service signs with here). Set your own key pair wherever tokens matter.
      IDENTITY_JWT_PUBLIC_KEY_LOCATION: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:-classpath:keys/public.pem}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Clients reach it through the gateway (/api/v1/notifications/**); 1118 is its own port.
    ports:
      - "1118:1118"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1118/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  # Kafka Streams app (risk, anomalies, dead letters). Internal only: it has no public API, so it
  # is not routed by the gateway; 1114 is its own port (actuator).
  risk-streams-service:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-risk-streams-service:${TAG:-latest}
    container_name: risk-streams-service
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: risk-streams-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    # RocksDB state of the topology: on a named volume it survives container recreation (without
    # it a new container restores every store from the changelog topics before it can serve).
    volumes:
      - risk-streams-state:/app/state
    # The app closes Kafka Streams within 30 s on shutdown; the default 10 s would SIGKILL it first.
    stop_grace_period: 60s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "1114:1114"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1114/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  api-gateway:
    image: ${REGISTRY:-ghcr.io/rapter1990}/aerotrace-api-gateway:${TAG:-latest}
    container_name: api-gateway
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      EUREKA_URL: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka}@discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      # The public key (PEM) that verifies the tokens. Empty: the copy of identity-service's
      # keys/public.pem that is packaged into the image (the development pair). Set it to your
      # own public key together with IDENTITY_JWT_PRIVATE_KEY_LOCATION / _PUBLIC_KEY_LOCATION of
      # the identity-service, e.g. JWT_PUBLIC_KEY_LOCATION=file:/run/secrets/jwt-public.pem
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    ports:
      # Published on every interface: put a reverse proxy with TLS in front of it to expose it further.
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - aerotrace

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - aerotrace

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - aerotrace

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    networks:
      - aerotrace

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    # Anyone who can reach it could push fake numbers: keep it on a trusted network (the script runs on the host).
    ports:
      - "9091:9091"
    networks:
      - aerotrace

  # Receives the alerts of Prometheus. Its UI and API have no login and can silence alerts, so the
  # port is published on the loopback interface only.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aerotrace

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - otel-collector
    networks:
      - aerotrace

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - aerotrace

volumes:
  # postgres-18-data: PostgreSQL 18 needs its own volume. The old postgres-data volume was made by an
  # older, Alpine-based or version 17 image (data owned by uid 70, layout of 17), so the current
  # image cannot start on it and the container exits. It is left untouched; remove it with
  # `docker volume rm aero-baggage-tracer_postgres-data` once you no longer need its contents.
  postgres-18-data:
  tempo-data:
  loki-data:
  risk-streams-state:
  elasticsearch-data:

networks:
  aerotrace:
    name: aerotrace
