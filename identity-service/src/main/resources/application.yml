server:
  port: 8081

spring:
  application:
    name: identity-service
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aerotrace}
    username: ${DB_USER:aerotrace}
    # No default: the service refuses to start rather than guess a database password.
    password: ${DB_PASSWORD}
    hikari:
      # Liquibase does not create the schema that holds its own tracking tables, so make sure it
      # exists before the first migration runs (a no-op once it does).
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS identity
  liquibase:
    # This service owns the "identity" schema; Liquibase tracks its changes there too.
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: identity
    liquibase-schema: identity

aerotrace:
  identity:
    # BCrypt cost factor for password hashes.
    bcrypt-strength: ${IDENTITY_BCRYPT_STRENGTH:12}
    keys:
      # RS256 or ES256, for newly generated signing keys.
      algorithm: ${IDENTITY_KEY_ALGORITHM:RS256}
      # base64 of 32 random bytes (openssl rand -base64 32). No default: private keys are stored
      # encrypted with it, and the service refuses to start without it.
      encryption-key: ${IDENTITY_KEY_ENCRYPTION_KEY}
      rotation-interval: ${IDENTITY_KEY_ROTATION_INTERVAL:30d}
      # A new key is published this long before it signs, so gateways have cached it by then.
      publish-lead: 10m
      cache-ttl: 10s
      maintenance-interval: PT5M
    token:
      # A replaced signing key stays published for ttl + clock-skew after it stops signing.
      ttl: 15m
      clock-skew: 1m
    seed:
      # Test users (agent, dispatcher, admin, two passengers). Development only; never in production.
      enabled: ${IDENTITY_SEED_ENABLED:false}
      # No default: seeding refuses to run without a password of at least 12 characters.
      password: ${IDENTITY_SEED_PASSWORD:}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # One entry per running instance, so several replicas can register side by side.
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          # Log lines go to the collector (and on to Loki), tagged with their trace id.
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # Metrics go to the OpenTelemetry collector, which Prometheus scrapes (no token needed).
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}
