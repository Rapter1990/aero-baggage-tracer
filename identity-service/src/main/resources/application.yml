server:
  port: 8081

spring:
  application:
    name: identity-service
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # One entry per running instance, so several replicas can register side by side.
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          # Log lines go to the collector (and on to Loki), tagged with their trace id.
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # Metrics go to the OpenTelemetry collector, which Prometheus scrapes (no token needed).
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}
