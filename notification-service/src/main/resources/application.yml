server:
  port: 1118

spring:
  application:
    name: notification-service
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aerotrace}
    username: ${DB_USER:aerotrace}
    # No default: the service refuses to start rather than guess a database password.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Liquibase does not create the schema that holds its own tracking tables.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS notification
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: notification
    liquibase-schema: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    admin:
      # With observation on, every traced send asks the cluster id through an admin client. With an
      # unreachable broker that call would wait for the admin client's 60 s default; these limits
      # keep a dead-letter publish close to the producer's own timeouts.
      close-timeout: 2s
      operation-timeout: 2s
      properties:
        default.api.timeout.ms: 3000
        request.timeout.ms: 2000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      # A first deploy or a group reset must not notify about up to 7 days of old case changes
      # (ADR 0005, decision 5). Replays are done on purpose, by moving the group's offsets.
      auto-offset-reset: latest
      # Offsets are committed by the listener container after a record was handled (or dead-lettered),
      # so only after the database statement committed.
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 300000
    producer:
      # Dead letters: the broker must have them before a row is marked as dead-lettered.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
        max.block.ms: 5000

aerotrace:
  notification:
    consumers:
      enabled: ${NOTIFICATION_CONSUMERS_ENABLED:true}
      # A transient failure is retried with a doubling wait (2, 4, 8, 16, 30 s: about a minute, long
      # enough to outlast a database failover), then the event is dead-lettered.
      retry-attempts: ${NOTIFICATION_CONSUMER_RETRY_ATTEMPTS:6}
      retry-backoff: ${NOTIFICATION_CONSUMER_RETRY_BACKOFF:2s}
      retry-max-backoff: ${NOTIFICATION_CONSUMER_RETRY_MAX_BACKOFF:30s}
    delivery:
      dispatch-delay: ${NOTIFICATION_DISPATCH_DELAY:1s}
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
      base-delay: ${NOTIFICATION_DELIVERY_BASE_DELAY:2s}
      max-delay: ${NOTIFICATION_DELIVERY_MAX_DELAY:5m}
      jitter: ${NOTIFICATION_DELIVERY_JITTER:0.2}
      batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
      # A claimed row belongs to its replica this long; longer than the provider timeout.
      lease: ${NOTIFICATION_DELIVERY_LEASE:60s}
      provider-timeout: ${NOTIFICATION_PROVIDER_TIMEOUT:10s}
      dead-letter-timeout: ${NOTIFICATION_DEAD_LETTER_TIMEOUT:10s}
    # Finished rows (SENT, or FAILED and dead-lettered) older than this are deleted. It must be longer
    # than the dead-letter topic's retention (30 d; the case topic keeps 7 d): purging removes the
    # dedupe key. A shorter one is refused at start-up.
    retention: ${NOTIFICATION_RETENTION:90d}
    purge:
      delay: ${NOTIFICATION_PURGE_DELAY:1h}
      batch-size: ${NOTIFICATION_PURGE_BATCH_SIZE:500}
      # Statements per run at most (500 x 1000 = 500,000 rows); the rest waits for the next run.
      max-batches: ${NOTIFICATION_PURGE_MAX_BATCHES:1000}
    docs:
      enabled: ${DOCS_ENABLED:true}
    jwt:
      audience: ${IDENTITY_AUDIENCE:aerotrace-api}
      # The identity-service public key (PEM), inline or from a location. No default: the service
      # refuses to start without one. The development key bundled in src/main/resources/keys is
      # only used where it is named explicitly (classpath:keys/public.pem), as Compose does.
      public-key: ${IDENTITY_JWT_PUBLIC_KEY:}
      public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.kafka.template: true
  observations:
    enable:
      # The dispatcher runs every second; idle runs must not fill the traces.
      tasks:
        scheduled:
          execution: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}

springdoc:
  api-docs:
    enabled: ${aerotrace.notification.docs.enabled}
