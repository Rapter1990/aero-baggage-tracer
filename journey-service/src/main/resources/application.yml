server:
  port: 1113

spring:
  application:
    name: journey-service
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aerotrace}
    username: ${DB_USER:aerotrace}
    # No default: the service refuses to start rather than guess a database password.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Liquibase does not create the schema that holds its own tracking tables.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS journey
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: journey
    liquibase-schema: journey
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # Every send is a span with the topic, so Kafka traffic shows up in Tempo.
      observation-enabled: true
    producer:
      # The outbox relay retries, so the producer must not reorder or duplicate on its own retries.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000

aerotrace:
  journey:
    # Shortest time that must pass between landing and the next departure (business rule on
    # connections). Registrations with a tighter connection are refused with a 400.
    minimum-connection-time: ${JOURNEY_MIN_CONNECTION_TIME:45m}
    # A scan whose event time is older than this when it arrives is flagged LATE_EVENT (BR-06). It is
    # still kept and published, but it never overwrites a newer state.
    late-event-grace: ${JOURNEY_LATE_EVENT_GRACE:10m}
    # A scan stamped further in the future than this is refused: the device clock is wrong.
    max-clock-skew: ${JOURNEY_MAX_CLOCK_SKEW:5m}
    outbox:
      # How often the relay looks for unpublished events, and how many it takes at a time.
      relay-delay: ${JOURNEY_OUTBOX_RELAY_DELAY:200ms}
      batch-size: ${JOURNEY_OUTBOX_BATCH_SIZE:200}
      # Published rows older than this are removed.
      retention: ${JOURNEY_OUTBOX_RETENTION:7d}
    docs:
      enabled: ${DOCS_ENABLED:true}
    jwt:
      audience: ${IDENTITY_AUDIENCE:aerotrace-api}
      # The identity-service public key (PEM), inline or from a location. With nothing set, the
      # development key bundled in src/main/resources/keys is used.
      public-key: ${IDENTITY_JWT_PUBLIC_KEY:}
      public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Timers made from observations have no buckets by default. The Kafka and Outbox dashboards
      # need buckets to show percentiles.
      percentiles-histogram:
        spring.kafka.template: true
        journey.outbox.relay: true
  observations:
    enable:
      # The relay runs every 200 ms. Without this, every idle run would be a trace of its own; the
      # relay creates a span itself for each run that has events.
      tasks:
        scheduled:
          execution: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}

springdoc:
  api-docs:
    enabled: ${aerotrace.journey.docs.enabled}
