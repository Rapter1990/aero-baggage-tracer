# Prometheus for local development: scrapes the OpenTelemetry collector, which holds the metrics
# and the span-derived request metrics of every service that exports to it.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Test coverage: observability/push-jacoco.ps1 pushes the JaCoCo numbers of every module here.
  # honor_labels keeps the job/module labels the script set instead of replacing them.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
