# Prometheus for local development: scrapes the OpenTelemetry collector, which holds the metrics
# and the span-derived request metrics of every service that exports to it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (shown on /alerts and sent to the Alertmanager below). Relative to this file's directory.
rule_files:
  - rules.yml

# Firing alerts go to the Alertmanager (alertmanager.yml), which groups and silences them.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The Alertmanager's own metrics (alerts held, notifications sent and failed).
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Elasticsearch (search read models): cluster, heap and index metrics for the
  # "AeroTrace - Elasticsearch" dashboard. The search-service's own indexing metrics arrive through
  # the collector above.
  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]

  # Test coverage: observability/push-jacoco.ps1 pushes the JaCoCo numbers of every module here.
  # honor_labels keeps the job/module labels the script set instead of replacing them.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
