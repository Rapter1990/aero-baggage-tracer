# Grafana Loki for local development, as one process. The OpenTelemetry Collector forwards the
# services' logs here over OTLP/HTTP (/otlp); Grafana queries it on port 3100.
# Each log record keeps its trace_id and span_id (as structured metadata), which Grafana uses to jump
# between a log line and its trace in Tempo. Logs are short-lived dev data.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # trace_id, span_id and the severity arrive as structured metadata (needs schema v13).
  allow_structured_metadata: true
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
