# Alertmanager for local development: groups, deduplicates and silences the alerts Prometheus sends.
# Browse it on http://localhost:9093, or in Grafana (Alerting, with the "Alertmanager" data source,
# and the "AeroTrace - Alerts" dashboard).
#
# The "local" receiver has no integration on purpose: alerts are visible, but nobody is notified.
# To notify someone, add an integration to a receiver, for example a webhook:
#   receivers:
#     - name: local
#       webhook_configs:
#         - url_file: /etc/alertmanager/secrets/webhook-url
#           send_resolved: true
# Read addresses and credentials from mounted files (url_file, api_url_file, auth_password_file);
# never commit them here.
route:
  receiver: local
  group_by: [alertname, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local
