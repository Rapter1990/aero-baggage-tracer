server:
  port: 8080

spring:
  application:
    name: api-gateway
  web:
    error:
      # Never put exception messages, stack traces or binding details into error responses.
      # (Spring Boot 4 moved these from server.error.* to spring.web.error.*.)
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  config:
    # Optional local settings (see the .env section of the README); real environment variables take precedence.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # Calls to downstream services (and other Boot-built HTTP clients): give up on a service that
      # does not connect or answer instead of holding a gateway thread.
      connect-timeout: 2s
      read-timeout: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # No default: Redis runs with requirepass, and the gateway refuses to start without it.
      password: ${REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webmvc:
          # Only the explicit routes below are exposed; the gateway proxies blocking, on servlet threads.
          routes:
            - id: identity-auth
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**
            - id: journey-bags
              uri: lb://journey-service
              predicates:
                - Path=/api/v1/bags/**
            - id: journey-scans
              uri: lb://journey-service
              predicates:
                - Path=/api/v1/scans/**
            - id: recovery-cases
              uri: lb://recovery-service
              predicates:
                - Path=/api/v1/recovery-cases/**
            - id: capacity
              uri: lb://capacity-service
              predicates:
                - Path=/api/v1/capacity/**
            - id: reports
              uri: lb://search-service
              predicates:
                - Path=/api/v1/reports/**
            # OpenAPI definitions of each service, fetched through the gateway for the Swagger UI.
            - id: docs-identity
              uri: lb://identity-service
              predicates:
                - Path=/service-docs/identity-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-journey
              uri: lb://journey-service
              predicates:
                - Path=/service-docs/journey-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-recovery
              uri: lb://recovery-service
              predicates:
                - Path=/service-docs/recovery-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-capacity
              uri: lb://capacity-service
              predicates:
                - Path=/service-docs/capacity-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-search
              uri: lb://search-service
              predicates:
                - Path=/service-docs/search-service
              filters:
                - SetPath=/v3/api-docs

aerotrace:
  gateway:
    audience: ${JWT_AUDIENCE:aerotrace-api}
    # The RSA public key (PEM) that verifies the tokens identity-service signs, inline or from a
    # location (a Spring resource or a file path). With both empty the gateway uses the copy of
    # identity-service's keys/public.pem that is packaged at build time (a development key pair
    # whose private key is in the repository: use your own pair wherever the tokens matter).
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    # Coarse edge authorization; resource services still enforce their own rules.
    role-rules:
      - pattern: /api/v1/admin/**
        roles: ADMIN
    docs:
      # Swagger UI and the definitions are served without a token. Set DOCS_ENABLED=false to turn
      # them off where the API map should stay private.
      enabled: ${DOCS_ENABLED:true}
    # Reverse proxies (addresses or CIDR networks, comma separated) whose X-Forwarded-For is believed
    # when working out the client address for rate limiting, for example 10.0.0.0/8. Empty: the header
    # is ignored, so it cannot be forged to get a fresh rate-limit bucket. Behind a proxy, set it,
    # or every client shares the proxy's bucket.
    trusted-proxies: ${TRUSTED_PROXIES:}
    rate-limit:
      replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
      burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}
      # A stricter bucket for each authentication endpoint (login, register, ...) per client
      # address: 0.2 tokens a second is 12 a minute, with a burst of 10.
      auth:
        replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:0.2}
        burst-capacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:10}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # One entry per running instance, so several gateways can register side by side.
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    # Register as "API-GATEWAY" and fetch the registry, which the lb:// routes resolve against.
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          # Log lines go to the collector (and on to Loki), tagged with their trace id.
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        # Metrics go to the OpenTelemetry collector, which Prometheus scrapes (no token needed).
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    # The "Select a definition" dropdown: one entry per service, served through this gateway.
    urls:
      - name: identity-service
        url: /service-docs/identity-service
      - name: journey-service
        url: /service-docs/journey-service
      - name: recovery-service
        url: /service-docs/recovery-service
      - name: capacity-service
        url: /service-docs/capacity-service
      - name: search-service
        url: /service-docs/search-service
