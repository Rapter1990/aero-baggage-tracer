server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # No default: Redis runs with requirepass, and the gateway refuses to start without it.
      password: ${REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webmvc:
          http-client:
            connect-timeout: 2s
            read-timeout: 30s
          # Only the explicit routes below are exposed; the gateway proxies blocking, on servlet threads.
          routes:
            - id: identity-auth
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**
            - id: journey-bags
              uri: lb://journey-service
              predicates:
                - Path=/api/v1/bags/**
            - id: journey-scans
              uri: lb://journey-service
              predicates:
                - Path=/api/v1/scans/**
            - id: recovery-cases
              uri: lb://recovery-service
              predicates:
                - Path=/api/v1/recovery-cases/**
            - id: capacity
              uri: lb://capacity-service
              predicates:
                - Path=/api/v1/capacity/**
            - id: reports
              uri: lb://search-service
              predicates:
                - Path=/api/v1/reports/**
            # OpenAPI definitions of each service, fetched through the gateway for the Swagger UI.
            - id: docs-identity
              uri: lb://identity-service
              predicates:
                - Path=/service-docs/identity-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-journey
              uri: lb://journey-service
              predicates:
                - Path=/service-docs/journey-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-recovery
              uri: lb://recovery-service
              predicates:
                - Path=/service-docs/recovery-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-capacity
              uri: lb://capacity-service
              predicates:
                - Path=/service-docs/capacity-service
              filters:
                - SetPath=/v3/api-docs
            - id: docs-search
              uri: lb://search-service
              predicates:
                - Path=/service-docs/search-service
              filters:
                - SetPath=/v3/api-docs

aerotrace:
  gateway:
    # No defaults for the trust anchors: the gateway must fail at startup rather than guess.
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE:aerotrace-api}
    jwk-set-uri: ${JWK_SET_URI}
    # Coarse edge authorization; resource services still enforce their own rules.
    role-rules:
      - pattern: /api/v1/admin/**
        roles: ADMIN
    docs:
      # Turn off outside development: Swagger UI and the definitions are served without a token.
      enabled: ${DOCS_ENABLED:true}
    rate-limit:
      replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
      burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # One entry per running instance, so several gateways can register side by side.
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    # Register as "API-GATEWAY" and fetch the registry, which the lb:// routes resolve against.
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    # The "Select a definition" dropdown: one entry per service, served through this gateway.
    urls:
      - name: identity-service
        url: /service-docs/identity-service
      - name: journey-service
        url: /service-docs/journey-service
      - name: recovery-service
        url: /service-docs/recovery-service
      - name: capacity-service
        url: /service-docs/capacity-service
      - name: search-service
        url: /service-docs/search-service
